# Free web service, durable data lives in Neon, never on the ephemeral disk.
services:
  - type: web
    name: nu-zhivi
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
